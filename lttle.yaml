volume:
  namespace: synk
  name: postgres-data
  mode: writeable
  size: 100Mi
---
app:
  namespace: synk
  name: app
  build: 
    docker:
      name: synk
  resources:
    cpu: 1
    memory: 256
  restart-policy: never
  mode:
    flash:
      strategy:
        listen-on-port: 3000
  environment:
    DATABASE_URL: postgresql://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@db-main.synk.svc.lttle.local:5432/${{ env.POSTGRES_DB }}
    NODE_ENV: ${{ env.NODE_ENV }}
    PORT: '3000'
    POSTGRES_DB: ${{ env.POSTGRES_DB }}
    POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
    POSTGRES_USER: ${{ env.POSTGRES_USER }}
    OPENAI_API_KEY: ${{ env.OPENAI_API_KEY }}
    FIRECRAWL_API_KEY: ${{ env.FIRECRAWL_API_KEY }}
  depends-on:
  - name: db
    namespace: synk
  expose:
    http:
      port: 3000
      external:
        protocol: https
---
app:
  namespace: synk
  name: db
  image: ghcr.io/lttle-cloud/postgres:17-flash
  resources:
    cpu: 1
    memory: 256
  mode:
    flash:
      strategy: manual
  volumes:
  - name: postgres-data
    namespace: synk
    path: /var/lib/postgresql/data
  environment:
    POSTGRES_DB: ${{ env.POSTGRES_DB }}
    POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
    POSTGRES_PORT: '5432'
    POSTGRES_USER: ${{ env.POSTGRES_USER }}
  expose:
    main:
      port: 5432
